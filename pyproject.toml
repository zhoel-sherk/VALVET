[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Default Ruff rule set; relax only where the codebase intentionally diverges.

[tool.ruff.lint.per-file-ignores]
# Deferred imports after sys.path / Qt class bodies (see src/app_pyside6.py).
"src/app_pyside6.py" = ["E402"]
# Tests prepend `src/` at runtime before importing application modules.
"tests/**" = ["E402"]

[tool.vulture]
paths = ["src"]
min_confidence = 80
exclude = ["**/yedytor/**"]
