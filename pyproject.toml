[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "slow: live Hanwha UPD.MDB import (mdbtools or ACE)",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Default Ruff is too noisy on this tree (UP/SIM/BLE). CI gates syntax/undefined
# names, unused imports, isort (I), and pandas/numpy aliases (ICN).
# Line length and deferred imports are ignored. Import policy: doc/info/IMPORTS.md
select = ["E", "F", "I", "ICN"]
ignore = ["E501", "E402", "E741"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.flake8-import-conventions.aliases]
numpy = "np"
pandas = "pd"
"machine_library.hanwha_sqlite_cache" = "hanwha_cache"
"machine_library.hanwha_mdbtools" = "mdbtools"
"machine_library.upd_geometry_load" = "upd_geom"
"pcb_preview.upd_footprint_builder" = "upd_fp"

[tool.ruff.lint.per-file-ignores]
# Deferred imports after sys.path / Qt class bodies (see src/app_pyside6.py).
"src/app_pyside6.py" = ["E402"]
# Tests prepend `src/` at runtime before importing application modules.
"tests/**" = ["E402"]

[tool.vulture]
paths = ["src"]
min_confidence = 80
exclude = ["**/yedytor/**"]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/app/*",
    "src/ui/*",
    "src/hanwha_mdb_edit/gui/*",
]

[tool.coverage.report]
skip_covered = true
show_missing = true
