name: Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional check only: version without leading v. Must equal src/__version__.py; leave empty to always accept"
        required: false
        default: ""
      create_release:
        description: Attach zip to a GitHub Release (tag v<version>)
        type: boolean
        default: true
      draft:
        description: Create or keep the GitHub Release as a draft
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-zip:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Single source of truth: src/__version__.py. The workflow_dispatch input is
      # validation only - it must never be the version that gets shipped.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(python tools/version.py show)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          REQUESTED="${{ inputs.version }}"
          if [ -n "${REQUESTED}" ] && [ "${REQUESTED}" != "${VERSION}" ]; then
            echo "::error::requested version '${REQUESTED}' != src/__version__.py '${VERSION}'" >&2
            exit 1
          fi
          python tools/version.py check
          echo "building VALVET ${VERSION}"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: PyInstaller onedir
        run: python -m PyInstaller valvet.spec

      # Zip BEFORE the smoke test: a frozen run creates logs/ next to the exe
      # (session_file_log resolves to dist/VALVET/logs), and that folder would
      # ship - it contains the user's absolute file paths.
      - name: Zip onedir folder
        run: |
          set -euo pipefail
          python -c "import shutil, os; v=os.environ['VERSION']; shutil.make_archive(f'VALVET-{v}-windows-x64', 'zip', 'dist', 'VALVET')"
          ls -la "VALVET-${VERSION}-windows-x64.zip"
          sha256sum "VALVET-${VERSION}-windows-x64.zip"
          if unzip -l "VALVET-${VERSION}-windows-x64.zip" | grep -q "VALVET/logs/"; then
            echo "::error::zip contains a logs/ folder" >&2
            exit 1
          fi

      # Smoke the shipped artifact, not dist/: exactly what the user unpacks.
      - name: Smoke unpacked zip
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          mkdir -p smoke
          unzip -q "VALVET-${VERSION}-windows-x64.zip" -d smoke
          ls -la smoke/VALVET | head -20
          ./smoke/VALVET/VALVET.exe --smoke

      - name: Attest zip provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: VALVET-${{ steps.version.outputs.version }}-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: VALVET-${{ steps.version.outputs.version }}-windows-x64
          path: VALVET-${{ steps.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error

      - name: GitHub Release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft }}
        run: |
          zip="VALVET-${VERSION}-windows-x64.zip"
          tag="v${VERSION}"
          notes="BETA v${VERSION} Windows onedir zip (PyInstaller). Qt DLLs live next to VALVET.exe. ACE ODBC and pythonocc are not bundled. SHA256 is in the job log. Optional: gh attestation verify ${zip} --repo ${GITHUB_REPOSITORY}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${zip}" --clobber
          elif [ "${DRAFT}" = "true" ]; then
            gh release create "${tag}" "${zip}" \
              --title "BETA v${VERSION}" \
              --notes "${notes}" \
              --draft
          else
            gh release create "${tag}" "${zip}" \
              --title "BETA v${VERSION}" \
              --notes "${notes}"
          fi
