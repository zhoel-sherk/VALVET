name: Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without leading v (must match APP_VERSION for About)
        required: false
        default: "0.2.0"
      create_release:
        description: Attach zip to a GitHub Release (tag v<version>)
        type: boolean
        default: true
      draft:
        description: Create or keep the GitHub Release as a draft
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-zip:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: PyInstaller onedir
        run: python -m PyInstaller valvet.spec

      - name: Smoke frozen exe
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/VALVET/VALVET.exe --smoke

      - name: Zip onedir folder
        run: |
          python -c "import shutil, os; v=os.environ['VERSION']; shutil.make_archive(f'VALVET-{v}-windows-x64', 'zip', 'dist', 'VALVET')"
          ls -la "VALVET-${VERSION}-windows-x64.zip"
          sha256sum "VALVET-${VERSION}-windows-x64.zip"

      - name: Attest zip provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: VALVET-${{ inputs.version }}-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: VALVET-${{ inputs.version }}-windows-x64
          path: VALVET-${{ inputs.version }}-windows-x64.zip
          if-no-files-found: error

      - name: GitHub Release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft }}
        run: |
          zip="VALVET-${VERSION}-windows-x64.zip"
          tag="v${VERSION}"
          notes="ALPHA v${VERSION} Windows onedir zip (PyInstaller). Qt DLLs live next to VALVET.exe. ACE ODBC and pythonocc are not bundled. SHA256 is in the job log. Optional: gh attestation verify ${zip} --repo ${GITHUB_REPOSITORY}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${zip}" --clobber
          elif [ "${DRAFT}" = "true" ]; then
            gh release create "${tag}" "${zip}" \
              --title "ALPHA v${VERSION}" \
              --notes "${notes}" \
              --draft
          else
            gh release create "${tag}" "${zip}" \
              --title "ALPHA v${VERSION}" \
              --notes "${notes}"
          fi
