name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# One monolithic `pytest tests` step took ~9 min and was a single point of
# failure: any flake failed the whole job and a timeout threw away every other
# signal. The suite is now split by the timings recorded in `.test_durations`,
# so each job is short, they run in parallel, and a failure names one shard.
# Regenerate the timings after adding a lot of tests with:
#
#   python -m pytest tests -q --ignore=tests/test_pcb_preview_gerber.py \
#     --splits 4 --group 1 --durations-path .test_durations --durations-min 0.01
#
# (the `--group 1` run executes one shard but records timings for every test.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    name: Lint / version / smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Qt runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libx11-xcb1 \
            libfontconfig1 \
            libfreetype6 \
            mdbtools

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax check (compileall)
        run: python -m compileall -q src

      - name: Ruff check
        run: python -m ruff check src tests

      - name: Ruff format
        run: python -m ruff format --check src tests

      - name: Version check (single source of truth)
        run: python -m tools.version check

      - name: Core has no PySide6
        run: python -m pytest tests/test_no_pyside6_core.py tests/test_cli_no_qt.py -q

      - name: Smoke (src/main.py --smoke)
        run: python src/main.py --smoke

      # Blocking: dead code is cheap to detect now that the gate is not advisory.
      - name: Vulture
        run: python -m vulture

      - name: pip-audit (non-blocking)
        continue-on-error: true
        run: python -m pip_audit -r requirements.txt

  test:
    name: Pytest ${{ matrix.shard }}/${{ matrix.total }} (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
        total: [4]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libx11-xcb1 \
            libfontconfig1 \
            libfreetype6 \
            mdbtools

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Pytest (shard)
        run: |
          python -m pytest tests -q \
            --ignore=tests/test_pcb_preview_gerber.py \
            --splits ${{ matrix.total }} \
            --group ${{ matrix.shard }} \
            --durations-path .test_durations

  coverage:
    name: Coverage ${{ matrix.shard }}/${{ matrix.total }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Qt runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libx11-xcb1 \
            libfontconfig1 \
            libfreetype6 \
            mdbtools

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      # Coverage spans the whole suite, so it is sharded too and the data files
      # are combined afterwards. Dropping the Gerber tests here (as an earlier
      # revision did) left that pipeline permanently uncovered while the report
      # still looked complete, so this shard set covers everything under tests/.
      #
      # The data file is deliberately NOT named `.coverage.shardN`:
      # actions/upload-artifact@v4 skips dotfiles unless include-hidden-files is
      # set, and an empty artifact trips if-no-files-found instead of merging.
      # `coverage combine <paths>` accepts arbitrary filenames (verified).
      - name: Pytest with coverage (shard)
        env:
          COVERAGE_FILE: coverage-shard${{ matrix.shard }}
        run: |
          python -m pytest tests -q \
            --splits ${{ matrix.total }} \
            --group ${{ matrix.shard }} \
            --durations-path .test_durations \
            --cov=src --cov-append --cov-report=

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage-shard${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 1

  coverage-report:
    name: Coverage report
    needs: coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt

      - name: Combine and report
        run: |
          set -euo pipefail
          ls -la coverage-shard*
          python -m coverage combine coverage-shard*
          python -m coverage report
