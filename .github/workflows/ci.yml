name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libx11-xcb1 \
            libfontconfig1 \
            libfreetype6 \
            mdbtools

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax check (compileall)
        env:
          PYTHONPATH: src
        run: python -m compileall -q src

      - name: Ruff (E/F)
        run: python -m ruff check src tests

      - name: Core has no PySide6 (pytest)
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_no_pyside6_core.py tests/test_cli_no_qt.py -q

      - name: Pytest (suite minus Gerber file)
        if: matrix.os != 'ubuntu-latest'
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q --ignore=tests/test_pcb_preview_gerber.py

      - name: Pytest with coverage
        if: matrix.os == 'ubuntu-latest'
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q --ignore=tests/test_pcb_preview_gerber.py --cov=src --cov-report=term

      - name: Smoke (src/main.py --smoke)
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: python src/main.py --smoke

      - name: Pytest (Gerber core)
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_pcb_preview_gerber.py -q

      - name: pip-audit (non-blocking)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: python -m pip_audit -r requirements.txt

      - name: Vulture (non-blocking)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: python -m vulture
