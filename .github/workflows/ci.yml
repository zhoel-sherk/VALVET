name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt

      - name: Syntax check (compileall)
        env:
          PYTHONPATH: src
        run: python -m compileall -q src

      - name: Pytest (suite minus Gerber file)
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q --ignore=tests/test_pcb_preview_gerber.py

      - name: Smoke (src/main.py --smoke)
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: python src/main.py --smoke

      - name: Pytest (Gerber core)
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_pcb_preview_gerber.py -q
